name: Build APK
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: APK-Toolbox-ja
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ja-${{ github.run_number }}
          name: APK Toolbox 日本語版 (${{ github.run_number }})
          body: universal はどの端末でも動きます。迷ったら universal を入れてください。
          files: app/build/outputs/apk/debug/*universal*.apk
